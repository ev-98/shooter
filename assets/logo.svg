<svg xmlns="http://www.w3.org/2000/svg" width="480" height="96" viewBox="0 0 480 96" role="img" aria-label="SHOOTER">
  <style>
    text {
      font-family: "FreeSans", "Arial Black", "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 72px;
      letter-spacing: 0.02em;
    }
    .face { fill: rgb(255, 230, 0); animation: title-flash 0.66s steps(1) infinite; }
    @keyframes title-flash {
      0%, 49%   { fill: rgb(255, 230, 0); }
      50%, 100% { fill: rgb(255, 190, 40); }
    }
    @media (prefers-reduced-motion: reduce) {
      .face { animation: none; }
    }
  </style>
  <text x="243" y="76" text-anchor="middle" fill="#000">SHOOTER</text>
  <text class="face" x="240" y="73" text-anchor="middle">SHOOTER</text>
</svg>
